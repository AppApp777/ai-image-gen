<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI 助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#7c3aed;--primary-hover:#6d28d9;--primary-light:#ede9fe;
  --bg:#f5f3ff;--surface:#fff;--text:#1f2937;--text-secondary:#6b7280;
  --border:#e5e7eb;--radius:16px;--shadow:0 4px 24px rgba(124,58,237,.08);
  --user-bubble:#7c3aed;--ai-bubble:#fff;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px}
.container{max-width:680px;margin:0 auto}

header{text-align:center;padding:24px 0 16px;position:relative}
header h1{font-size:26px;font-weight:700;color:var(--primary)}

.settings-bar{position:absolute;top:24px;right:0}
.settings-bar button{font-size:13px;color:var(--text-secondary);background:none;
  border:1px solid var(--border);border-radius:8px;padding:4px 12px;cursor:pointer}
.settings-bar button:hover{border-color:var(--primary);color:var(--primary)}

/* tabs */
.tabs{display:flex;gap:8px;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tab{flex:1;height:40px;border:none;background:none;border-radius:8px;font-size:15px;
  font-weight:500;cursor:pointer;color:var(--text-secondary);transition:all .15s}
.tab.active{background:var(--primary);color:#fff}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}

.mode-section{display:none}
.mode-section.active{display:block}

/* ============ chat mode ============ */
.chat-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:480px}
.chat-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.chat-header select{height:34px;padding:0 10px;border:1px solid var(--border);
  border-radius:8px;font-size:13px;background:var(--surface);outline:none;cursor:pointer;color:var(--text)}
.chat-header select:focus{border-color:var(--primary)}
.chat-header-actions{display:flex;gap:4px}
.chat-header button{font-size:13px;color:var(--primary);background:none;border:none;
  cursor:pointer;padding:6px 12px;border-radius:6px}
.chat-header button:hover{background:var(--primary-light)}

.modal-list{max-width:440px}
.history-list{max-height:400px;overflow-y:auto;margin:8px 0 16px}
.history-list .empty{text-align:center;padding:30px 10px;color:var(--text-secondary);font-size:14px}
.history-list .item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;
  cursor:pointer;transition:background .15s;border:1px solid transparent}
.history-list .item:hover{background:var(--primary-light)}
.history-list .item.active{background:var(--primary-light);border-color:var(--primary)}
.history-list .item .info{flex:1;min-width:0}
.history-list .item .title{font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-weight:500}
.history-list .item .meta{font-size:11px;color:var(--text-secondary);margin-top:2px}
.history-list .item .del{width:28px;height:28px;border:none;background:none;color:var(--text-secondary);
  font-size:18px;cursor:pointer;border-radius:6px;flex-shrink:0;padding:0;line-height:1}
.history-list .item .del:hover{background:#fef2f2;color:#dc2626}

.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.empty-chat{text-align:center;color:var(--text-secondary);padding:40px 20px;font-size:14px}
.empty-chat .icon{font-size:32px;margin-bottom:12px;opacity:.4}

.msg{display:flex;max-width:85%;flex-direction:column;gap:4px}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start;align-items:flex-start}
.msg .bubble{padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--user-bubble);color:#fff;border-bottom-right-radius:4px}
.msg.ai .bubble{background:var(--ai-bubble);color:var(--text);border-bottom-left-radius:4px;
  border:1px solid var(--border)}
.msg .time{font-size:11px;color:var(--text-secondary);padding:0 4px}

/* markdown */
.msg.ai .bubble{white-space:normal}
.msg.ai .bubble>*:first-child{margin-top:0}
.msg.ai .bubble>*:last-child{margin-bottom:0}
.msg.ai .bubble p{margin:0.6em 0}
.msg.ai .bubble h1,.msg.ai .bubble h2,.msg.ai .bubble h3,.msg.ai .bubble h4{margin:0.8em 0 0.4em;font-weight:600;line-height:1.3}
.msg.ai .bubble h1{font-size:18px}
.msg.ai .bubble h2{font-size:17px}
.msg.ai .bubble h3{font-size:16px}
.msg.ai .bubble h4{font-size:15px}
.msg.ai .bubble ul,.msg.ai .bubble ol{margin:0.4em 0;padding-left:1.5em}
.msg.ai .bubble li{margin:0.2em 0}
.msg.ai .bubble code{background:#f3f0ff;color:#6d28d9;padding:1px 6px;border-radius:4px;
  font-family:"SF Mono",Consolas,Monaco,monospace;font-size:0.9em}
.msg.ai .bubble pre{background:#1f1f2e;color:#e9e7ff;padding:12px 14px;border-radius:8px;
  overflow-x:auto;margin:0.6em 0;font-size:13px;line-height:1.5}
.msg.ai .bubble pre code{background:none;color:inherit;padding:0;border-radius:0;font-size:inherit}
.msg.ai .bubble a{color:var(--primary);text-decoration:underline}
.msg.ai .bubble blockquote{border-left:3px solid var(--primary);padding-left:12px;color:var(--text-secondary);
  margin:0.6em 0}
.msg.ai .bubble strong{font-weight:600}
.msg.ai .bubble em{font-style:italic}
.msg.ai .bubble hr{border:none;border-top:1px solid var(--border);margin:1em 0}
.msg.ai .bubble table{border-collapse:collapse;margin:0.6em 0;font-size:13px}
.msg.ai .bubble th,.msg.ai .bubble td{border:1px solid var(--border);padding:6px 10px}
.msg.ai .bubble th{background:var(--primary-light);font-weight:600}

.typing{display:flex;gap:4px;align-items:center;padding:10px 14px;background:var(--ai-bubble);
  border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px;width:fit-content}
.typing span{width:6px;height:6px;background:var(--text-secondary);border-radius:50%;
  animation:bounce 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

.chat-input-area{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.chat-input-area textarea{flex:1;min-height:40px;max-height:120px;border:2px solid var(--border);
  border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;resize:none;outline:none;
  font-family:inherit;transition:border-color .2s}
.chat-input-area textarea:focus{border-color:var(--primary)}
.chat-input-area button{height:40px;padding:0 18px;border:none;border-radius:10px;
  background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
.chat-input-area button:disabled{opacity:.55;cursor:not-allowed}

/* ============ image mode ============ */
textarea.image-prompt{width:100%;min-height:120px;border:2px solid var(--border);border-radius:12px;
  padding:14px 16px;font-size:15px;line-height:1.6;resize:vertical;outline:none;
  font-family:inherit;transition:border-color .2s}
textarea.image-prompt:focus{border-color:var(--primary)}
textarea.image-prompt::placeholder{color:#c4b5fd}

.upload-section{margin-top:16px}
.upload-label{font-size:14px;color:var(--text-secondary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.upload-label span.count{color:var(--primary);font-weight:600}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:16px;
  text-align:center;cursor:pointer;transition:all .2s;min-height:60px;
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--primary-light)}
.upload-zone .hint{color:var(--text-secondary);font-size:14px;width:100%}
.upload-zone input{display:none}
.preview-item{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;flex-shrink:0}
.preview-item img{width:100%;height:100%;object-fit:cover}
.preview-item .remove{position:absolute;top:2px;right:2px;width:20px;height:20px;
  background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;
  font-size:14px;line-height:20px;text-align:center;cursor:pointer;padding:0}

.controls{display:flex;gap:12px;margin-top:16px;align-items:center}
select{flex:0 0 auto;height:44px;padding:0 14px;border:2px solid var(--border);
  border-radius:10px;font-size:14px;background:var(--surface);outline:none;cursor:pointer;color:var(--text)}
.btn-generate{flex:1;height:44px;border:none;border-radius:10px;
  background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-generate:hover:not(:disabled){background:var(--primary-hover);transform:translateY(-1px)}
.btn-generate:disabled{opacity:.55;cursor:not-allowed}

.result{margin-top:20px;display:none}
.result.visible{display:block}
.progress-section{padding:24px 0;text-align:center}
.progress-bar-bg{width:100%;height:8px;background:var(--primary-light);border-radius:4px;overflow:hidden;margin:16px 0 12px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),#a78bfa);border-radius:4px;
  transition:width .5s ease;width:0%}
.progress-text{font-size:15px;color:var(--text);font-weight:500}
.progress-sub{font-size:13px;color:var(--text-secondary);margin-top:6px}
.progress-tip{font-size:12px;color:#a78bfa;margin-top:12px;
  background:var(--primary-light);padding:8px 12px;border-radius:8px;display:inline-block}

.image-box{border-radius:12px;overflow:hidden;position:relative}
.image-box img{width:100%;display:block;border-radius:12px}
#imgFallback{text-align:center;padding:20px}
#imgFallback p{color:var(--text-secondary);margin-bottom:8px}
#imgFallback a{color:var(--primary);word-break:break-all}
.image-actions{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.image-actions button{height:36px;padding:0 20px;border:2px solid var(--primary);
  border-radius:8px;background:transparent;color:var(--primary);font-size:14px;
  font-weight:500;cursor:pointer;transition:all .15s}
.image-actions button:hover{background:var(--primary);color:#fff}
.error-msg{background:#fef2f2;color:#dc2626;padding:14px 16px;border-radius:10px;font-size:14px;line-height:1.5}

.history{margin-top:24px}
.history h2{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;
  align-items:center;justify-content:space-between}
.history h2 button{font-size:13px;color:var(--text-secondary);background:none;
  border:none;cursor:pointer;text-decoration:underline}
.history-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.history-item{background:var(--surface);border-radius:12px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.05);cursor:pointer;transition:transform .15s}
.history-item:hover{transform:translateY(-2px)}
.history-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.history-item .meta{padding:8px 10px;font-size:12px;color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ shared ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;
  align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:var(--radius);padding:32px;
  max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h2{font-size:20px;margin-bottom:8px;text-align:center}
.modal p{color:var(--text-secondary);font-size:14px;margin-bottom:20px;text-align:center}
.modal label{display:block;font-size:14px;color:var(--text);margin-bottom:6px;margin-top:14px;font-weight:500}
.modal input{width:100%;height:44px;border:2px solid var(--border);border-radius:10px;
  padding:0 14px;font-size:14px;outline:none}
.modal input:focus{border-color:var(--primary)}
.modal .hint{font-size:12px;color:var(--text-secondary);margin-top:4px}
.modal .btn-confirm{width:100%;height:44px;border:none;border-radius:10px;margin-top:20px;
  background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;
  align-items:center;justify-content:center;z-index:200;cursor:zoom-out;padding:20px}
.lightbox img{max-width:95%;max-height:95%;border-radius:8px}

@media(max-width:480px){
  body{padding:12px 10px}
  header{padding:16px 0 12px}
  header h1{font-size:22px}
  .settings-bar{top:16px}
  .card{padding:16px}
  textarea.image-prompt{min-height:100px}
  .controls{flex-direction:column}
  select,.btn-generate{width:100%}
  .history-grid{grid-template-columns:1fr 1fr;gap:8px}
  .preview-item{width:60px;height:60px}
  .chat-card{height:calc(100vh - 170px)}
  .msg{max-width:90%}
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>AI 助手</h1>
    <div class="settings-bar">
      <button id="settingsBtn">设置</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-mode="chat">聊天</button>
    <button class="tab" data-mode="image">生图</button>
  </div>

  <!-- ============ Chat Mode ============ -->
  <section class="mode-section active" id="modeChat">
    <div class="chat-card">
      <div class="chat-header">
        <select id="chatModel">
          <option value="gpt-5-5">GPT-5.5 (快)</option>
          <option value="gpt-5-5-thinking">GPT-5.5 Thinking (高质量)</option>
        </select>
        <div class="chat-header-actions">
          <button id="historyChatBtn">历史</button>
          <button id="newChatBtn">新对话</button>
        </div>
      </div>
      <div class="messages" id="messages">
        <div class="empty-chat" id="emptyChat">
          <div class="icon">💬</div>
          <div>开始你的对话吧</div>
        </div>
      </div>
      <div class="chat-input-area">
        <textarea id="chatInput" placeholder="输入消息，回车发送..." rows="1"></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </section>

  <!-- ============ Image Mode ============ -->
  <section class="mode-section" id="modeImage">
    <div class="card">
      <textarea class="image-prompt" id="prompt" placeholder="描述你想要的图片，比如：一只橘猫趴在窗台上晒太阳，水彩风格"></textarea>

      <div class="upload-section">
        <div class="upload-label">风格参考图（可选，最多 9 张）<span class="count" id="imgCount"></span></div>
        <div class="upload-zone" id="uploadZone">
          <span class="hint" id="uploadHint">点击或拖拽图片到这里</span>
          <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
      </div>

      <div class="controls">
        <select id="model">
          <option value="gpt-5-5">GPT-5.5 (推荐)</option>
          <option value="gpt-5-5-thinking">GPT-5.5 Thinking (慢但质量高)</option>
        </select>
        <button class="btn-generate" id="generateBtn">生成</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="card">
        <div class="progress-section" id="progressSection" style="display:none">
          <div class="progress-text" id="progressText">正在生成中...</div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
          <div class="progress-sub" id="progressSub">已等待 0 秒</div>
          <div class="progress-tip">通常需要 30~90 秒，请保持页面打开</div>
        </div>
        <div class="image-box" id="imageBox" style="display:none">
          <img id="resultImg" alt="生成的图片" referrerpolicy="no-referrer" crossorigin="anonymous">
          <div id="imgFallback" style="display:none">
            <p>图片加载失败，点击下方链接查看：</p>
            <a id="imgLink" href="" target="_blank"></a>
          </div>
          <div class="image-actions">
            <button id="downloadBtn">保存图片</button>
            <button id="openBtn">查看原图</button>
            <button id="reuseBtn">再来一张</button>
          </div>
        </div>
        <div class="error-msg" id="errorMsg" style="display:none"></div>
      </div>
    </div>

    <section class="history" id="historySection" style="display:none">
      <h2>历史记录 <button id="clearHistory">清空</button></h2>
      <div class="history-grid" id="historyGrid"></div>
    </section>
  </section>
</div>

<!-- settings modal -->
<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal">
    <h2>设置</h2>
    <p>首次使用需要填写，之后会自动记住</p>
    <label>API Key</label>
    <input type="password" id="inputApiKey" placeholder="sk-..." autocomplete="off">
    <div class="hint">chat01.ai 的 API Key</div>
    <label>API 地址</label>
    <input type="text" id="inputBaseUrl" placeholder="https://chat01.ai/v1/chat/completions">
    <div class="hint">一般不用改</div>
    <button class="btn-confirm" id="settingsSave">保存</button>
  </div>
</div>

<!-- chat history modal -->
<div class="modal-overlay" id="historyModal" style="display:none">
  <div class="modal modal-list">
    <h2>历史会话</h2>
    <div class="history-list" id="historyList"></div>
    <button class="btn-confirm" id="historyClose">关闭</button>
  </div>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox" style="display:none">
  <img id="lightboxImg">
</div>

<script>
const $ = id => document.getElementById(id);
const LS = key => "ai_img_" + key;
const MAX_IMAGES = 9;
const MAX_PX = 1024;
const IMG_URL_RE = /!\[[^\]]*\]\((https:\/\/files\.chat01\.ai\/[^)]+)\)/;
const LOG_ENDPOINT = "https://web-nine-pink-93.vercel.app/api/log";
const DEFAULT_BASE_URL = "https://chat01.ai/v1/chat/completions";

let generating = false;
let chatting = false;
let timerInterval = null;
let lastImageUrl = "";
let refImages = [];
let conversations = [];
let currentChatId = null;
let currentMode = "chat";

function getSetting(key, fallback) { return localStorage.getItem(LS(key)) || fallback; }
function setSetting(key, val) { localStorage.setItem(LS(key), val); }

// ==================== settings ====================
function showSettings() {
  $("inputApiKey").value = getSetting("apiKey", "");
  $("inputBaseUrl").value = getSetting("baseUrl", DEFAULT_BASE_URL);
  $("settingsModal").style.display = "flex";
  $("inputApiKey").focus();
}
function saveSettings() {
  const key = $("inputApiKey").value.trim();
  if (!key) { $("inputApiKey").focus(); return; }
  setSetting("apiKey", key);
  setSetting("baseUrl", $("inputBaseUrl").value.trim() || DEFAULT_BASE_URL);
  $("settingsModal").style.display = "none";
}
function ensureSettings() {
  if (!getSetting("apiKey", "")) { showSettings(); return false; }
  return true;
}

// ==================== tab switching ====================
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
  $("modeChat").classList.toggle("active", mode === "chat");
  $("modeImage").classList.toggle("active", mode === "image");
  if (mode === "chat") setTimeout(() => $("chatInput").focus(), 50);
}

// ==================== chat ====================
function genId() { return "c_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8); }

function loadConversations() {
  try { conversations = JSON.parse(localStorage.getItem(LS("chats")) || "[]"); }
  catch { conversations = []; }
  // migrate old single-chat
  if (conversations.length === 0) {
    try {
      const oldMessages = JSON.parse(localStorage.getItem(LS("chat")) || "[]");
      if (oldMessages.length > 0) {
        const firstUser = oldMessages.find(m => m.role === "user");
        const title = firstUser ? firstUser.content.slice(0, 20) : "迁移的对话";
        conversations = [{ id: genId(), title, messages: oldMessages, updatedAt: Date.now() }];
      }
    } catch {}
  }
  currentChatId = localStorage.getItem(LS("currentChatId"));
  if (!currentChatId || !conversations.find(c => c.id === currentChatId)) {
    currentChatId = conversations[0]?.id || null;
  }
}

function saveConversations() {
  localStorage.setItem(LS("chats"), JSON.stringify(conversations.slice(0, 100)));
  if (currentChatId) localStorage.setItem(LS("currentChatId"), currentChatId);
}

function getCurrentChat() {
  return conversations.find(c => c.id === currentChatId);
}

function ensureCurrentChat() {
  let chat = getCurrentChat();
  if (!chat) {
    chat = { id: genId(), title: "新对话", messages: [], updatedAt: Date.now() };
    conversations.unshift(chat);
    currentChatId = chat.id;
    saveConversations();
  }
  return chat;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderMd(text) {
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
    return escapeHtml(text);
  }
  try {
    const html = marked.parse(text, { breaks: true, gfm: true });
    return DOMPurify.sanitize(html);
  } catch {
    return escapeHtml(text);
  }
}

function renderMessages() {
  const box = $("messages");
  const chat = getCurrentChat();
  const messages = chat?.messages || [];
  if (messages.length === 0) {
    box.innerHTML = '<div class="empty-chat" id="emptyChat"><div class="icon">💬</div><div>开始你的对话吧</div></div>';
    return;
  }
  box.innerHTML = messages.map(m => {
    const content = m.role === "ai" || m.role === "assistant" ? renderMd(m.content) : escapeHtml(m.content);
    return '<div class="msg ' + m.role + '"><div class="bubble">' + content + '</div></div>';
  }).join("");
  box.scrollTop = box.scrollHeight;
}

function appendTyping() {
  const box = $("messages");
  const div = document.createElement("div");
  div.className = "msg ai";
  div.id = "typingIndicator";
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function removeTyping() {
  const t = $("typingIndicator");
  if (t) t.remove();
}

function newChat() {
  const chat = { id: genId(), title: "新对话", messages: [], updatedAt: Date.now() };
  conversations.unshift(chat);
  currentChatId = chat.id;
  saveConversations();
  renderMessages();
  $("chatInput").focus();
}

function switchToChat(id) {
  currentChatId = id;
  saveConversations();
  renderMessages();
  $("historyModal").style.display = "none";
  $("chatInput").focus();
}

function deleteChat(id) {
  if (!confirm("确定删除这个对话？")) return;
  conversations = conversations.filter(c => c.id !== id);
  if (currentChatId === id) {
    currentChatId = conversations[0]?.id || null;
  }
  saveConversations();
  renderConversationList();
  renderMessages();
}

function timeAgo(ts) {
  const sec = Math.floor((Date.now() - ts) / 1000);
  if (sec < 60) return "刚刚";
  if (sec < 3600) return Math.floor(sec / 60) + "分钟前";
  if (sec < 86400) return Math.floor(sec / 3600) + "小时前";
  if (sec < 86400 * 7) return Math.floor(sec / 86400) + "天前";
  return new Date(ts).toLocaleDateString();
}

function renderConversationList() {
  const list = $("historyList");
  if (conversations.length === 0) {
    list.innerHTML = '<div class="empty">暂无历史会话</div>';
    return;
  }
  const sorted = [...conversations].sort((a, b) => b.updatedAt - a.updatedAt);
  list.innerHTML = sorted.map(c => {
    const isActive = c.id === currentChatId ? " active" : "";
    return '<div class="item' + isActive + '" data-id="' + c.id + '">' +
      '<div class="info"><div class="title">' + escapeHtml(c.title || "未命名") + '</div>' +
      '<div class="meta">' + c.messages.length + ' 条消息 · ' + timeAgo(c.updatedAt) + '</div></div>' +
      '<button class="del" data-id="' + c.id + '" title="删除">×</button></div>';
  }).join("");
}

function showHistory() {
  renderConversationList();
  $("historyModal").style.display = "flex";
}

async function sendChat() {
  const text = $("chatInput").value.trim();
  if (!text || chatting) return;
  if (!ensureSettings()) return;

  const chat = ensureCurrentChat();
  chat.messages.push({ role: "user", content: text });
  chat.updatedAt = Date.now();
  if (chat.title === "新对话") {
    chat.title = text.slice(0, 20) + (text.length > 20 ? "..." : "");
  }
  $("chatInput").value = "";
  $("chatInput").style.height = "auto";
  renderMessages();
  saveConversations();

  chatting = true;
  $("sendBtn").disabled = true;
  appendTyping();

  const apiKey = getSetting("apiKey", "");
  const baseUrl = getSetting("baseUrl", DEFAULT_BASE_URL);

  try {
    const res = await fetch(baseUrl, {
      method: "POST",
      headers: { Authorization: "Bearer " + apiKey, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: $("chatModel").value,
        messages: chat.messages.map(m => ({ role: m.role, content: m.content })),
      }),
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error("API " + res.status + ": " + errText.slice(0, 200));
    }
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || "(没有回复)";
    chat.messages.push({ role: "assistant", content: reply });
    chat.updatedAt = Date.now();
    saveConversations();
    logChat($("chatModel").value, text, reply);
  } catch (err) {
    chat.messages.push({ role: "assistant", content: "出错了：" + err.message });
    chat.updatedAt = Date.now();
    saveConversations();
  } finally {
    chatting = false;
    $("sendBtn").disabled = false;
    removeTyping();
    renderMessages();
    $("chatInput").focus();
  }
}

// auto-resize chat textarea
$("chatInput").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
});
$("chatInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
$("sendBtn").addEventListener("click", sendChat);
$("newChatBtn").addEventListener("click", newChat);
$("historyChatBtn").addEventListener("click", showHistory);
$("historyClose").addEventListener("click", () => { $("historyModal").style.display = "none"; });
$("historyList").addEventListener("click", e => {
  const delBtn = e.target.closest(".del");
  if (delBtn) { e.stopPropagation(); deleteChat(delBtn.dataset.id); return; }
  const item = e.target.closest(".item");
  if (item) switchToChat(item.dataset.id);
});

// ==================== image upload ====================
function resizeImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let {width, height} = img;
      if (width > MAX_PX || height > MAX_PX) {
        const scale = MAX_PX / Math.max(width, height);
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.8));
    };
    img.src = URL.createObjectURL(file);
  });
}
async function addFiles(files) {
  const remaining = MAX_IMAGES - refImages.length;
  const toAdd = Array.from(files).slice(0, remaining);
  for (const file of toAdd) {
    if (!file.type.startsWith("image/")) continue;
    const dataUrl = await resizeImage(file);
    refImages.push({dataUrl, previewUrl: URL.createObjectURL(file)});
  }
  renderPreviews();
}
function removeImage(idx) {
  URL.revokeObjectURL(refImages[idx].previewUrl);
  refImages.splice(idx, 1);
  renderPreviews();
}
function renderPreviews() {
  const zone = $("uploadZone");
  const hint = $("uploadHint");
  zone.querySelectorAll(".preview-item").forEach(el => el.remove());
  if (refImages.length === 0) {
    hint.style.display = "block"; hint.textContent = "点击或拖拽图片到这里";
    $("imgCount").textContent = "";
  } else {
    hint.style.display = refImages.length >= MAX_IMAGES ? "none" : "block";
    if (refImages.length < MAX_IMAGES) hint.textContent = "继续添加...";
    $("imgCount").textContent = refImages.length + "/" + MAX_IMAGES;
    refImages.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "preview-item";
      div.innerHTML = '<img src="' + item.previewUrl + '"><button class="remove" data-idx="' + i + '">x</button>';
      zone.insertBefore(div, hint);
    });
  }
}
$("uploadZone").addEventListener("click", e => {
  if (e.target.closest(".remove")) { removeImage(+e.target.dataset.idx); return; }
  if (refImages.length < MAX_IMAGES) $("fileInput").click();
});
$("fileInput").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
$("uploadZone").addEventListener("dragover", e => { e.preventDefault(); $("uploadZone").classList.add("dragover"); });
$("uploadZone").addEventListener("dragleave", () => $("uploadZone").classList.remove("dragover"));
$("uploadZone").addEventListener("drop", e => { e.preventDefault(); $("uploadZone").classList.remove("dragover"); addFiles(e.dataTransfer.files); });

// ==================== image history ====================
function loadHistory() { try { return JSON.parse(localStorage.getItem(LS("history")) || "[]"); } catch { return []; } }
function saveHistory(list) { localStorage.setItem(LS("history"), JSON.stringify(list.slice(0, 50))); }
function renderHistory() {
  const list = loadHistory();
  if (!list.length) { $("historySection").style.display = "none"; return; }
  $("historySection").style.display = "block";
  $("historyGrid").innerHTML = list.map((item, i) =>
    '<div class="history-item" data-idx="' + i + '">' +
    '<img src="' + item.url + '" alt="" loading="lazy" referrerpolicy="no-referrer">' +
    '<div class="meta">' + item.prompt + '</div></div>'
  ).join("");
}
function addToHistory(prompt, url) {
  const list = loadHistory();
  list.unshift({ prompt: prompt.slice(0, 100), url, time: Date.now() });
  saveHistory(list);
  renderHistory();
}

// ==================== progress ====================
const STAGES = [[0,15,"正在分析描述..."],[15,40,"AI 构图中..."],[40,70,"渲染画面中..."],[70,90,"细节优化中..."],[90,99,"即将完成..."]];
function updateProgress(seconds) {
  const pct = Math.min(99, seconds * 1.2);
  $("progressBar").style.width = pct + "%";
  $("progressSub").textContent = "已等待 " + seconds + " 秒";
  for (const [lo, hi, text] of STAGES) { if (pct >= lo && pct < hi) { $("progressText").textContent = text; break; } }
}

// ==================== log ====================
function postLog(title, content) {
  fetch(LOG_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, content }),
  }).catch(() => {});
}
function logImage(prompt, model, imageUrl, refCount) {
  const body = '<p><b>Prompt:</b> ' + escapeHtml(prompt.slice(0, 200)) + '</p>'
    + '<p><b>模型:</b> ' + model + (refCount ? ' | 参考图: ' + refCount + '张' : '') + '</p>'
    + '<p><img src="' + imageUrl + '" style="max-width:100%"></p>';
  postLog("AI绘图 - 新图生成", body);
}
function logChat(model, userMsg, aiMsg) {
  const body = '<p><b>模型:</b> ' + model + '</p>'
    + '<p><b>用户:</b><br>' + escapeHtml(userMsg).replace(/\n/g, "<br>") + '</p>'
    + '<p><b>AI:</b><br>' + escapeHtml(aiMsg.slice(0, 800)).replace(/\n/g, "<br>") + '</p>';
  postLog("AI聊天 - 新消息", body);
}

// ==================== generate image ====================
async function generate() {
  const prompt = $("prompt").value.trim();
  if (!prompt || generating) return;
  if (!ensureSettings()) return;

  const apiKey = getSetting("apiKey", "");
  const baseUrl = getSetting("baseUrl", DEFAULT_BASE_URL);
  const model = $("model").value;

  let userContent;
  if (refImages.length > 0) {
    userContent = refImages.map(item => ({ type: "image_url", image_url: { url: item.dataUrl } }));
    userContent.push({ type: "text", text: prompt });
  } else {
    userContent = prompt;
  }

  generating = true;
  $("generateBtn").disabled = true;
  $("generateBtn").textContent = "生成中...";
  $("result").classList.add("visible");
  $("progressSection").style.display = "block";
  $("progressBar").style.width = "0%";
  $("imageBox").style.display = "none";
  $("errorMsg").style.display = "none";

  let seconds = 0;
  updateProgress(0);
  timerInterval = setInterval(() => { seconds++; updateProgress(seconds); }, 1000);

  try {
    const res = await fetch(baseUrl, {
      method: "POST",
      headers: { Authorization: "Bearer " + apiKey, "Content-Type": "application/json" },
      body: JSON.stringify({
        model,
        messages: [
          { role: "system", content: "You are an image generation assistant. Generate an image based on the user's description. If reference images are provided, use them as style/composition reference. Always respond with a generated image, never just text." },
          { role: "user", content: userContent },
        ],
      }),
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error("API 返回 " + res.status + ": " + text.slice(0, 200));
    }
    const data = await res.json();
    const content = data.choices?.[0]?.message?.content || "";
    const match = content.match(IMG_URL_RE);

    if (match) {
      $("progressBar").style.width = "100%";
      $("progressText").textContent = "完成！";
      lastImageUrl = match[1];
      $("imgFallback").style.display = "none";
      $("resultImg").style.display = "block";
      $("resultImg").onerror = () => {
        $("resultImg").style.display = "none";
        $("imgLink").href = lastImageUrl;
        $("imgLink").textContent = lastImageUrl;
        $("imgFallback").style.display = "block";
      };
      $("resultImg").src = lastImageUrl;
      setTimeout(() => { $("progressSection").style.display = "none"; $("imageBox").style.display = "block"; }, 500);
      addToHistory(prompt, lastImageUrl);
      logImage(prompt, model, lastImageUrl, refImages.length);
    } else {
      throw new Error("没有生成图片，请重试\n" + content.slice(0, 200));
    }
  } catch (err) {
    $("progressSection").style.display = "none";
    $("errorMsg").textContent = err.message;
    $("errorMsg").style.display = "block";
  } finally {
    clearInterval(timerInterval);
    generating = false;
    $("generateBtn").disabled = false;
    $("generateBtn").textContent = "生成";
  }
}

// ==================== download ====================
async function downloadImage() {
  if (!lastImageUrl) return;
  try {
    const res = await fetch(lastImageUrl);
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ai-image-" + Date.now() + ".jpg";
    a.click();
    URL.revokeObjectURL(a.href);
  } catch { window.open(lastImageUrl, "_blank"); }
}

// ==================== events ====================
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchMode(t.dataset.mode)));
$("generateBtn").addEventListener("click", generate);
$("prompt").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") generate(); });
$("downloadBtn").addEventListener("click", downloadImage);
$("openBtn").addEventListener("click", () => { if (lastImageUrl) window.open(lastImageUrl, "_blank"); });
$("reuseBtn").addEventListener("click", () => { $("result").classList.remove("visible"); $("prompt").focus(); });
$("clearHistory").addEventListener("click", () => { if (confirm("确定清空所有历史记录？")) { saveHistory([]); renderHistory(); } });
$("historyGrid").addEventListener("click", e => {
  const item = e.target.closest(".history-item");
  if (!item) return;
  const list = loadHistory();
  const idx = +item.dataset.idx;
  if (list[idx]) { $("lightboxImg").src = list[idx].url; $("lightbox").style.display = "flex"; }
});
$("lightbox").addEventListener("click", () => { $("lightbox").style.display = "none"; });
$("settingsBtn").addEventListener("click", showSettings);
$("settingsSave").addEventListener("click", saveSettings);
$("inputApiKey").addEventListener("keydown", e => { if (e.key === "Enter") saveSettings(); });

// ==================== init ====================
loadConversations();
renderMessages();
renderHistory();
if (!getSetting("apiKey", "")) showSettings();
$("chatInput").focus();
</script>
